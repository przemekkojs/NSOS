components:
  schemas:
    CalendarEvent:
      type: object
      description: Serializer that formats Class (event) data for FullCalendar
      properties:
        id:
          type: integer
        title:
          type: string
          readOnly: true
        start:
          type: string
          readOnly: true
        end:
          type: string
          readOnly: true
        extendedProps:
          allOf:
          - $ref: '#/components/schemas/CalendarExtendedProps'
          readOnly: true
      required:
      - end
      - extendedProps
      - id
      - start
      - title
    CalendarExtendedProps:
      type: object
      description: Internal helper to document extendedProps structure
      properties:
        courseName:
          type: string
        room:
          type: string
          nullable: true
        lecturerName:
          type: string
        groupName:
          type: string
        status:
          type: string
      required:
      - courseName
      - groupName
      - lecturerName
      - room
      - status
    Class:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        lecturer:
          type: integer
        course_group:
          allOf:
          - $ref: '#/components/schemas/CourseGroup'
          readOnly: true
        date_held:
          type: string
          format: date
      required:
      - course_group
      - date_held
      - id
      - lecturer
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course_code:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 255
        weekly_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
        weeks_count:
          type: integer
          maximum: 32767
          minimum: -32768
        ects:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
        course_group:
          type: integer
          nullable: true
        course_type:
          $ref: '#/components/schemas/CourseTypeEnum'
        faculty:
          type: integer
      required:
      - course_code
      - course_type
      - faculty
      - id
      - name
      - weekly_hours
      - weeks_count
    CourseGroup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course:
          type: integer
        name:
          type: string
          maxLength: 100
        lecturer:
          type: integer
          nullable: true
        weekday:
          type: string
          maxLength: 10
        start_time:
          type: string
          format: time
        max_students:
          type: integer
          maximum: 2147483647
          minimum: 0
        end_time:
          type: string
          format: time
        room:
          type: string
          maxLength: 50
        semester:
          type: integer
      required:
      - course
      - end_time
      - id
      - name
      - room
      - semester
      - start_time
      - weekday
    CourseTypeEnum:
      enum:
      - zal
      - zst
      - egz
      - ekm
      type: string
      description: |-
        * `zal` - Credit
        * `zst` - Graded Credit
        * `egz` - Exam
        * `ekm` - Committee Exam
    Faculty:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        university:
          type: integer
      required:
      - id
      - name
      - university
    Lecturer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        faculty:
          type: integer
        position:
          type: integer
